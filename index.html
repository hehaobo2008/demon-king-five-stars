<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>魔王也要五星好评</title>
  </head>
  <body>
    <main class="stage">
      <header class="plaque">
        <h1>魔王也要五星好评</h1>
        <p class="subtitle">先摆好道具，再开门迎客。</p>
        <button id="btn-sound" class="sound-toggle" type="button" aria-pressed="false" aria-label="音效开关">
          <img id="sound-icon" alt="" />
        </button>
      </header>

      <div class="play-area">
        <div class="canvas-wrap frame">
          <canvas id="game" width="768" height="576" aria-label="魔王的地牢地图"></canvas>
          <div id="bubble" class="bubble" hidden></div>
          <div id="coach" class="coach" hidden>
            <img id="coach-avatar" class="coach-avatar" alt="小管家" />
            <span id="coach-text"></span>
          </div>
          <div id="alarm" class="alarm" hidden>
            <img id="alarm-icon" class="alarm-icon" alt="" />
            <span id="alarm-text"></span>
          </div>

          <div id="review-card" class="review" hidden>
            <div class="receipt">
              <div class="review-panel">
                <div class="review-head">
                  <div class="review-title" id="review-title">新手剑士的评价单</div>
                  <div id="review-seal" class="review-seal">五星神店</div>
                </div>
                <div id="review-stars" class="review-stars" role="img" aria-label="星级"></div>
                <ul id="review-events" class="review-events"></ul>
                <p id="review-comment" class="review-comment"></p>
                <ul id="review-missing" class="review-missing"></ul>
                <div class="btn-row">
                  <button id="btn-next" class="btn primary" hidden>接下一单</button>
                  <button id="btn-again" class="btn primary">再布置一趟</button>
                </div>
              </div>
              <div class="receipt-teeth" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <aside id="sidebar" class="frame ledger">
          <div class="ledger-top">
            <div class="gold-line">
              <canvas id="coin-spin" class="coin-spin" width="16" height="16" aria-hidden="true"></canvas>
              <div class="gold">金币 <span id="gold">100</span><span id="gold-delta" class="gold-delta" hidden></span></div>
              <div class="speed" role="group" aria-label="营业速度">
                <button id="spd-1" class="spd active">1×</button>
                <button id="spd-2" class="spd">2×</button>
              </div>
            </div>
            <div id="order-tabs" class="order-tabs" hidden>
              <button id="tab-order1" class="tab active">首单 · 剑士</button>
              <button id="tab-order2" class="tab">第二单 · 机关迷</button>
            </div>
          </div>

          <div class="ledger-main">
            <section class="guest-reserve">
              <span class="avatar-frame knight" id="avatar-frame">
                <img id="guest-avatar" class="guest-avatar" alt="预约客人头像" />
              </span>
              <div class="guest-info">
                <div class="guest-title" id="guest-title">今日预约 · 新手剑士</div>
                <p class="guest-quote" id="guest-quote">「我是新手剑士，想拿到<em class="kw">勇者徽章</em>。侧室的<em class="kw">宝箱</em>我要开，守卫那一锤我也想<em class="kw">挡</em>。」</p>
              </div>
              <div class="btn-row">
                <button id="btn-open" class="btn primary">开门营业</button>
                <button id="btn-reset" class="btn">重新布置</button>
              </div>
              <button id="btn-trap" class="btn trap" hidden>
                <span id="trap-label" class="trap-label">弩机待命 · 客人靠近可拉闸</span>
                <span id="trap-timer-fill" class="trap-timer-fill" aria-hidden="true"></span>
              </button>
            </section>

            <section class="shop">
              <div class="card" data-type="chest" title="按住拖到地图空地砖">
                <img alt="宝箱" draggable="false" />
                <div class="card-info">
                  <div class="card-name">宝箱</div>
                  <div class="card-use">放进侧室，客人会去开</div>
                </div>
                <div class="card-price"><span class="coin"></span><span class="price"></span></div>
              </div>

              <div class="card" data-type="shield" title="按住拖到地图空地砖">
                <img alt="盾牌架" draggable="false" />
                <div class="card-info">
                  <div class="card-name">盾牌架</div>
                  <div class="card-use">摆在必经之路，捡起挡锤</div>
                </div>
                <div class="card-price"><span class="coin"></span><span class="price"></span></div>
              </div>

              <div class="card" data-type="sign" title="按住拖到地图空地砖；摆好后点击可转向">
                <img alt="路牌" draggable="false" />
                <div class="card-info">
                  <div class="card-name">路牌</div>
                  <div class="card-use">摆上点击，给客人指路</div>
                </div>
                <div class="card-price"><span class="coin"></span><span class="price"></span></div>
              </div>

              <div class="shop-tags">
                <span>拖拽 摆放／退回</span>
                <span>点路牌 转向</span>
              </div>
            </section>
          </div>

          <p id="status" class="status place">把道具拖到空地砖上摆放</p>

          <section class="run-log">
            <div class="run-log-title">本次营业记录</div>
            <ul id="log-list" class="log-list"></ul>
          </section>

          <div id="drop-hint" class="drop-hint" hidden>松手收回 · 全额退金币</div>
        </aside>
      </div>
    </main>

    <div id="ghost"><img alt="" draggable="false" /></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
